<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: Cash Flow Visionaries Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1E8E5A 0%, #0A5D39 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .preview-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .preview-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #E6CF87;
        }
        .preview-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .frame-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .browser-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #f5f5f5;
            border-radius: 10px 10px 0 0;
            border-bottom: 1px solid #ddd;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .url-bar {
            flex: 1;
            margin-left: 12px;
            padding: 6px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #666;
        }
        iframe {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 0 0 10px 10px;
            background: white;
        }
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #C9A441;
            color: #063B25;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(201,164,65,0.3);
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(201,164,65,0.4);
            background: #D8B95E;
        }
        .btn.secondary {
            background: white;
            color: #0A5D39;
        }
        .info {
            text-align: center;
            color: white;
            margin-top: 24px;
            opacity: 0.85;
            font-size: 0.95rem;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #27c93f;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview-header">
            <div class="status">
                <span class="status-dot"></span>
                <span>Live Preview Running</span>
            </div>
            <h1>Cash Flow Visionaries</h1>
            <p>Your Professional Landing Page is Ready!</p>
        </div>
        
        <div class="frame-container">
            <div class="browser-bar">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <div class="url-bar">http://localhost:8888/index.html</div>
            </div>
            <iframe src="http://localhost:8888/index.html" title="Cash Flow Visionaries Preview"></iframe>
        </div>
        
        <div class="buttons">
            <a href="http://localhost:8888/index.html" target="_blank" class="btn">Open in New Tab</a>
            <a href="index.html" class="btn secondary">View Source</a>
        </div>
        
        <div class="info">
            <p>✨ Fully responsive • Professional design • Ready to deploy</p>
            <p style="margin-top: 8px; font-size: 0.85rem;">Server running on port 8888 • Stop with: pkill -f "python3 -m http.server 8888"</p>
        </div>
    </div>
</body>
</html>

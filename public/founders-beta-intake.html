<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Intake | Cash Flow Visionaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1E8E5A;
      --forest: #0F4C35;
      --gold-rich: #C9A961;
      --white: #FFFFFF;
      --cream: #F9F6F0;
      --ink: #1A1A1A;
      --muted: #5B6E64;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Montserrat", Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
    }
    .container { width: min(720px, calc(100% - 40px)); margin: 0 auto; }
    
    header {
      background: var(--white);
      border-bottom: 1px solid rgba(220,236,226,.5);
      padding: 20px 0;
    }
    .brand-logo { height: 56px; }
    
    .content {
      padding: 64px 0;
    }
    h1 {
      color: var(--forest);
      font-size: 2.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 48px;
    }
    
    .form-card {
      background: var(--white);
      border: 2px solid var(--gold-rich);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 6px 24px rgba(15,76,53,.08);
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      color: var(--forest);
      font-weight: 600;
      font-size: .9rem;
      margin-bottom: 8px;
    }
    label .required {
      color: #C94441;
      margin-left: 4px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #E5E5E5;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color .3s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--gold-rich);
    }
    input:read-only {
      background: #F5F5F5;
      color: var(--muted);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .readonly-note {
      font-size: .85rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 6px;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #C9A961, #B8954F);
      color: var(--white);
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-weight: 800;
      font-size: .95rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(201,169,97,.3);
      transition: all .3s ease;
      margin-top: 32px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(201,169,97,.4);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    @media(max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
    }
    
    .loading {
      text-align: center;
      padding: 100px 20px;
    }
    .spinner {
      border: 4px solid rgba(30,142,90,.2);
      border-top: 4px solid var(--green);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/">
        <img src="/assets/cash-flow-visionaries-logo.jpg" alt="Cash Flow Visionaries" class="brand-logo">
      </a>
    </div>
  </header>

  <section class="content">
    <div class="container">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading your information...</p>
      </div>

      <div id="form-container" style="display:none;">
        <h1>Founder Intake</h1>
        <p class="subtitle">
          Complete your information to begin your Founder-Beta experience.
        </p>

        <form class="form-card" id="intake-form">
          <input type="hidden" id="sessionId" name="sessionId">

          <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
            <input type="text" name="fullName" id="fullName" required>
          </div>

          <div class="form-group">
            <label>Preferred Name</label>
            <input type="text" name="preferredName" id="preferredName" placeholder="What should we call you?">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email Address <span class="required">*</span></label>
              <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
              <label>Phone Number <span class="required">*</span></label>
              <input type="tel" name="phone" id="phone" required>
            </div>
          </div>

          <div class="form-group">
            <label>Address Line 1 <span class="required">*</span></label>
            <input type="text" name="addressLine1" id="addressLine1" required>
          </div>

          <div class="form-group">
            <label>Address Line 2</label>
            <input type="text" name="addressLine2" id="addressLine2">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>City <span class="required">*</span></label>
              <input type="text" name="city" id="city" required>
            </div>
            <div class="form-group">
              <label>State / Province <span class="required">*</span></label>
              <input type="text" name="stateProvince" id="stateProvince" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Postal Code <span class="required">*</span></label>
              <input type="text" name="postalCode" id="postalCode" required>
            </div>
            <div class="form-group">
              <label>Country <span class="required">*</span></label>
              <input type="text" name="country" id="country" required>
            </div>
          </div>

          <div class="form-group">
            <label>Preferred Contact Method <span class="required">*</span></label>
            <select name="preferredContactMethod" id="preferredContactMethod" required>
              <option value="">Select...</option>
              <option value="Email">Email</option>
              <option value="Phone">Phone</option>
              <option value="Text">Text Message</option>
            </select>
          </div>

          <div class="form-group">
            <label>Founder-Beta Level</label>
            <input type="text" id="founderLevel" readonly>
            <p class="readonly-note">
              Your Founder-Beta Level is verified from your purchase and cannot be changed.
            </p>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Complete Founder Intake
          </button>
        </form>
      </div>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');

    if (!sessionId) {
      window.location.href = '/founders-beta/participate.html';
    }

    // Load founder data
    fetch(`/api/verify-founder?session_id=${sessionId}`)
      .then(res => res.json())
      .then(data => {
        if (!data.verified) {
          window.location.href = '/founders-beta/participate.html';
          return;
        }

        // Check if already completed
        if (data.founderIntakeStatus === 'Complete') {
          window.location.href = '/founders-beta-orientation.html';
          return;
        }

        // Prefill form
        document.getElementById('sessionId').value = sessionId;
        document.getElementById('fullName').value = data.fullName || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('phone').value = data.phone || '';
        document.getElementById('founderLevel').value = data.founderLevel || '';

        // Show form
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form-container').style.display = 'block';
      })
      .catch(err => {
        alert('Error loading your information. Please try again.');
        window.location.href = '/founders-beta/participate.html';
      });

    // Handle form submission
    document.getElementById('intake-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      const formData = new FormData(e.target);

      try {
        const response = await fetch('/api/intake', {
          method: 'POST',
          body: formData,
        });

        if (response.redirected) {
          window.location.href = response.url;
        } else if (response.ok) {
          window.location.href = '/founders-beta-intake-complete.html';
        } else {
          throw new Error('Submission failed');
        }
      } catch (error) {
        alert('Error submitting form. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Founder Intake';
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Welcome, Founding Visionary | Cash Flow Visionaries Founders Beta" />
  <title>Welcome, Founding Visionary | Cash Flow Visionaries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --green:#1E8E5A;
      --green-dark:#0A5D39;
      --forest:#0F4C35;
      --gold:#C9A441;
      --gold-rich:#C9A961;
      --gold-light:#E6CF87;
      --white:#FFFFFF;
      --cream:#F9F6F0;
      --ivory:#FFFEF9;
      --ink:#1A1A1A;
      --muted:#5B6E64;
      --line:#DCECE2;
      --radius:16px;
      --shadow:0 6px 24px rgba(15,76,53,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--ivory);
      color:var(--ink);
      font-family:"Montserrat",Arial,sans-serif;
      font-size:16px;
      line-height:1.65;
      min-height:100vh;
    }
    .container{width:min(1120px,calc(100% - 40px));margin:0 auto}

    /* HEADER */
    .header{
      background:rgba(255,255,255,.98);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(220,236,226,.5);
      padding:20px 0;
      box-shadow:0 2px 12px rgba(15,76,53,.04);
    }
    .brand-logo{
      display:block;
      height:56px;
      width:auto;
    }

    /* HERO */
    .hero{
      background:linear-gradient(135deg, var(--forest) 0%, var(--green-dark) 100%);
      padding:80px 0;
      text-align:center;
      color:var(--white);
      position:relative;
      overflow:hidden;
    }
    .hero:before{
      content:'';
      position:absolute;
      top:-200px;
      right:-200px;
      width:500px;
      height:500px;
      background:radial-gradient(circle, rgba(201,169,97,.12) 0%, transparent 70%);
      pointer-events:none;
    }
    .hero-eyebrow{
      color:var(--gold-light);
      font-size:.72rem;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:16px;
    }
    .hero h1{
      font-size:clamp(2rem, 5vw, 3.6rem);
      font-weight:700;
      margin-bottom:24px;
      letter-spacing:-.02em;
      line-height:1.1;
    }
    .hero-subtitle{
      font-size:1.12rem;
      color:rgba(255,255,255,.92);
      max-width:680px;
      margin:0 auto 32px;
      line-height:1.7;
    }
    .hero-level{
      display:inline-block;
      background:rgba(255,255,255,.15);
      border:2px solid var(--gold-light);
      border-radius:12px;
      padding:18px 36px;
      margin-top:20px;
    }
    .hero-level-label{
      font-size:.78rem;
      color:var(--gold-light);
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:8px;
    }
    .hero-level-value{
      font-size:1.5rem;
      font-weight:700;
      color:var(--white);
    }

    /* CONTENT */
    .content{
      background:var(--white);
      padding:80px 0;
    }
    .content h2{
      color:var(--forest);
      font-size:2rem;
      font-weight:700;
      text-align:center;
      margin-bottom:24px;
    }
    .content p{
      font-size:1.08rem;
      color:var(--muted);
      text-align:center;
      max-width:680px;
      margin:0 auto 48px;
      line-height:1.75;
    }
    .cta-wrapper{
      text-align:center;
    }
    .cta-btn{
      display:inline-block;
      background:linear-gradient(135deg, var(--gold-rich), var(--gold));
      color:var(--white);
      padding:20px 40px;
      border-radius:12px;
      font-weight:800;
      font-size:1rem;
      letter-spacing:.06em;
      text-transform:uppercase;
      box-shadow:0 6px 20px rgba(201,169,97,.3);
      transition:all .3s ease;
      border:none;
      cursor:pointer;
      text-decoration:none;
    }
    .cta-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 32px rgba(201,169,97,.4);
    }

    /* CLOSING */
    .closing{
      background:var(--cream);
      padding:56px 0;
      text-align:center;
      color:var(--muted);
      font-size:1rem;
      font-weight:500;
    }

    /* LOADING */
    .loading{
      text-align:center;
      padding:120px 20px;
    }
    .spinner{
      border:4px solid rgba(30,142,90,.2);
      border-top:4px solid var(--green);
      border-radius:50%;
      width:56px;
      height:56px;
      animation:spin 1s linear infinite;
      margin:0 auto 24px;
    }
    @keyframes spin{
      0%{transform:rotate(0deg)}
      100%{transform:rotate(360deg)}
    }
    .loading p{
      color:var(--muted);
      font-size:1.05rem;
    }

    /* ERROR */
    .error{
      background:#FEE;
      border:2px solid #C44;
      border-radius:12px;
      padding:32px;
      margin:60px auto;
      max-width:680px;
      color:#822;
      text-align:center;
    }
    .error h2{
      color:#C44;
      margin-bottom:16px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="/">
        <img src="../assets/cash-flow-visionaries-logo.jpg" alt="Cash Flow Visionaries" class="brand-logo">
      </a>
    </div>
  </header>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Verifying your Founder-Beta participation...</p>
    </div>
  </div>

  <script>
    // Get session_id from URL
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const demoMode = params.get('demo') === 'true';

    if (!sessionId && !demoMode) {
      window.location.href = '/founders-beta/participate';
    }

    // Demo mode - skip API verification
    if (demoMode) {
      const demoData = {
        verified: true,
        paymentStatus: 'paid',
        founderLevel: 'Citizen Founder-Beta',
        fullName: 'Demo User',
        email: 'demo@example.com'
      };
      displayConfirmation(demoData, 'demo-session-123');
      return;
    }

    // Verify payment with backend API
    fetch(`https://cfv-content-engine.vercel.app/api/founders-beta/verify?session_id=${sessionId}`)
      .then(res => res.json())
      .then(data => {
        if (!data.verified || data.paymentStatus !== 'paid') {
          window.location.href = '/founders-beta/participate';
          return;
        }
        displayConfirmation(data, sessionId);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = `
          <div class="container">
            <div class="error">
              <h2>Verification Error</h2>
              <p>We couldn't verify your payment. Please contact support or try again.</p>
            </div>
          </div>
        `;
      });

    function displayConfirmation(data, sessionId) {

        // Display confirmation page
        document.getElementById('content').innerHTML = `
          <section class="hero">
            <div class="container">
              <div class="hero-eyebrow">Network Leveraging Cash Flow</div>
              <h1>WELCOME, FOUNDING VISIONARY</h1>
              <p class="hero-subtitle">
                Your Founder-Beta Participation Is Confirmed.
              </p>
              <p class="hero-subtitle">
                You have officially taken the next step in helping Establish the
                Foundation of the Cash Flow Visionaries Movement.
              </p>
              <div class="hero-level">
                <div class="hero-level-label">Your Founder-Beta Level</div>
                <div class="hero-level-value">${data.founderLevel}</div>
              </div>
            </div>
          </section>

          <section class="content">
            <div class="container">
              <h2>Next Step</h2>
              <p>
                Your next step is to complete your Founder Intake and begin Founder
                Orientation.
              </p>
              <div class="cta-wrapper">
                <a href="/founders-beta/intake?session_id=${sessionId}" class="cta-btn">
                  Complete Your Founder Intake
                </a>
              </div>
            </div>
          </section>

          <section class="closing">
            <div class="container">
              <p>Connecting One Cash Flow Visionary at a Time.</p>
            </div>
          </section>
        `;
    }
  </script>
</body>
</html>
